seed: 1
device: cuda

# ==========================================
# ABLATION STUDY CONFIGURATION
# Dataset: CIFAKE (Real and AI-Generated Synthetic Images)
# https://www.kaggle.com/datasets/birdy654/cifake-real-and-ai-generated-synthetic-images
# ==========================================

data:
  dataset_name: CIFAKE (Real and AI-Generated Synthetic Images)
  dataset_root: C:/Users/kumar/.cache/kagglehub/datasets/birdy654/cifake-real-and-ai-generated-synthetic-images/versions/3
  test_dir: C:/Users/kumar/.cache/kagglehub/datasets/birdy654/cifake-real-and-ai-generated-synthetic-images/versions/3/test
  root: C:/Users/kumar/.cache/kagglehub/datasets/birdy654/cifake-real-and-ai-generated-synthetic-images/versions/3
  test_split: test
  val_split: test
  num_classes: 2
  img_size: 224

models:
  efficientnet_b3:
    output_dir: runs/efficientnet_b3
    transforms:
      eval:
        ensure_rgb: true
        val_resize: true
        val_center_crop: true
    inference:
      weights: weights/efficientnet_b3.pth
      split: test
      batch_size: 256
      num_workers: 2
      img_size: 224

  efficientformerv2_s1:
    output_dir: runs/efficientformerv2_s1
    transforms:
      eval:
        ensure_rgb: true
        val_resize: true
        val_center_crop: true
    inference:
      weights: weights/efficientformerv2_s1.pth
      split: test
      batch_size: 256
      num_workers: 4
      img_size: 224

  faster_vit_2_224:
    output_dir: runs/faster_vit_2_224
    transforms:
      eval:
        ensure_rgb: true
        val_resize: true
        val_center_crop: true
    inference:
      weights: weights/faster_vit_2_224.pth
      split: test
      batch_size: 256
      num_workers: 4
      img_size: 224

selection:
  - efficientnet_b3
  - efficientformerv2_s1
  - faster_vit_2_224
